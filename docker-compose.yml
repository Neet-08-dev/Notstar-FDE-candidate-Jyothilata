services:
  mock-api:
    build: .
    command: ["python", "-m", "northstar.api", "--host", "0.0.0.0"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-development-only}
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 30
  agent:
    build: .
    command: ["python", "-m", "starter.agent", "--host", "0.0.0.0"]
    environment:
      API_URL: http://mock-api:8001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-development-only}
    env_file:
      - path: .env
        required: false
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      mock-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 30
  public-evals:
    build: .
    command: ["python", "-m", "public.run", "--agent-url", "http://agent:8000", "--api-url", "http://mock-api:8001"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-development-only}
    profiles: ["evals"]
    depends_on:
      agent: {condition: service_healthy}
