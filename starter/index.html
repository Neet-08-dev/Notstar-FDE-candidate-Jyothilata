<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northstar operations starter</title>
<style>body{font:17px system-ui;margin:48px auto;max-width:800px;padding:0 24px;color:#183244;background:#f4f7f9}h1{font-size:36px}label{display:block;margin:20px 0 8px}input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid #9bb2be;border-radius:6px}button{margin-top:18px;background:#17665e;color:white;border:0;border-radius:6px;padding:12px 20px;font:inherit}pre{white-space:pre-wrap;background:white;border:1px solid #c6d6df;padding:20px;border-radius:8px}small{color:#496579}</style>
<h1>Northstar operations</h1><p>A fictional service desk for factories, warehouses and distributors.</p><small>The starter creates no service actions until you implement it. Each demo uses a fresh test session.</small>
<form id="request"><label for="subject">Subject</label><input id="subject" value="Cooling service at Aster Foods"><label for="body">Request</label><textarea id="body" rows="5">Please schedule service for ticket T001 at S001 with a qualified technician at the earliest eligible slot.</textarea><button id="run">Investigate request</button></form>
<pre id="result" aria-live="polite">The response will appear here.</pre>
<script>document.getElementById('request').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('run');b.disabled=true;document.getElementById('result').textContent='Investigating…';try{const r=await fetch('/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:document.getElementById('subject').value,body:document.getElementById('body').value})});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById('result').textContent=String(e)}finally{b.disabled=false}})</script></html>
